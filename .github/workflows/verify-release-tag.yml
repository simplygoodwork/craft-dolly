# Checks a version tag before it's released: Craft 5 releases come from
# main-craft5, and the Plugin Store takes a release's notes from the
# CHANGELOG.md heading for its version.
#
# The Plugin Store is notified of the tag whether or not this passes, so a
# failure means the tag should be deleted (and the release, if the store has
# made one) and pushed again from the right commit.

name: Verify release tag
run-name: Verify ${{ github.ref_name }}

on:
  push:
    tags:
      - '*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main-craft5
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main-craft5; then
            echo "::error::$GITHUB_REF_NAME isn't on main-craft5. Tag Craft 5 releases on main-craft5."
            exit 1
          fi

      - name: CHANGELOG.md has a heading for the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## $version - YYYY-MM-DD\" heading. The Plugin Store needs one for the release notes."
            exit 1
          fi
