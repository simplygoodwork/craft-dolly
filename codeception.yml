actor: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
bootstrap: _bootstrap.php
settings:
  colors: true
  memory_limit: 1024M
modules:
  config:
    \simplygoodwork\craftdolly\tests\support\CraftModule:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'https://test.dolly.test/index.php'
      projectConfig: {}
      migrations: []
      plugins:
        - class: '\simplygoodwork\craftdolly\Plugin'
          handle: dolly
        - class: '\craft\ckeditor\Plugin'
          handle: ckeditor
        - class: '\benf\neo\Plugin'
          handle: neo
        - class: '\verbb\hyper\Hyper'
          handle: hyper
        - class: '\nystudio107\seomatic\Seomatic'
          handle: seomatic
        - class: '\presseddigital\linkit\Linkit'
          handle: linkit
        - class: '\ether\seo\Seo'
          handle: seo
        - class: '\verbb\formie\Formie'
          handle: formie
        - class: '\percipiolondon\colourswatches\ColourSwatches'
          handle: colour-swatches
        - class: '\Solspace\Calendar\Calendar'
          handle: calendar
        - class: '\nystudio107\retour\Retour'
          handle: retour
        - class: '\lewisjenkins\craftdynamicfields\CraftDynamicFields'
          handle: craft-dynamic-fields
        - class: '\ether\simplemap\SimpleMap'
          handle: simplemap
        - class: '\jalendport\preparse\PreparseField'
          handle: preparse-field
        - class: '\rias\positionfieldtype\PositionFieldtype'
          handle: position-fieldtype
        - class: '\nystudio107\codefield\CodeField'
          handle: codefield
        - class: '\verbb\tablemaker\TableMaker'
          handle: tablemaker
        - class: '\verbb\iconpicker\IconPicker'
          handle: icon-picker
      cleanup: true
      transaction: true
      dbSetup: { clean: true, setupCraft: true }
      fullMock: false
