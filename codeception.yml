actor: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
bootstrap: _bootstrap.php
settings:
  colors: true
  memory_limit: 1024M
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'https://test.portage.test/index.php'
      projectConfig: {}
      migrations: []
      plugins:
        - class: '\simplygoodwork\craftportage\Plugin'
          handle: portage
        - class: '\craft\ckeditor\Plugin'
          handle: ckeditor
        - class: '\benf\neo\Plugin'
          handle: neo
        - class: '\verbb\hyper\Hyper'
          handle: hyper
        - class: '\nystudio107\seomatic\Seomatic'
          handle: seomatic
        - class: '\presseddigital\linkit\Linkit'
          handle: linkit
        - class: '\ether\seo\Seo'
          handle: seo
      cleanup: true
      transaction: true
      dbSetup: { clean: true, setupCraft: true }
      fullMock: false
